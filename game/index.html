<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamplight — a museum stealth game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e18; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #0b0e18; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600" aria-label="Lamplight: sneak through the museum, steal the jewel and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
